services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitou
      POSTGRES_PASSWORD: monitou
      POSTGRES_DB: monitou
    ports:
      - "5433:5432" # host 5433 -> avoid clashing with a locally-installed Postgres on 5432
    volumes:
      - monitou_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitou -d monitou"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://monitou:monitou@db:5432/monitou
      JWT_SECRET_KEY: dev-secret-change-me
    ports:
      - "8000:8000"

volumes:
  monitou_pg_data:
